# Sixteen Tmote Skys: 15 clients on a 4 x 4 grid (its last corner left
# empty) with the RPL root in the middle.  Each node only hears its grid
# neighbours, so the corners reach the root over three hops.  15 clients,
# not 16: the bundled udp-server's routing table holds 16 routes, one of
# them its own, so a 16th client would never be answered.  Watch the
# routes (the arrows in the browser) settle towards node 1.
#   cngsim run grid-sky --ui

version: 2
title: "A 4 x 4 RPL grid round its root"
timeout_ms: 300000
seed: 42
startup_delay_ms: 1000

medium:
  type: udgm
  tx_range: 55              # the grid is 50 m: only the neighbours in a row or column
  interference_range: 110

mote_types:
  - { name: server, firmware: ../firmware/sky/udp-server.sky }
  - { name: client, firmware: ../firmware/sky/udp-client.sky }

nodes:
  - { type: server, id: 1, x: 75, y: 75 }
  # Layouts place many nodes at once: grid (columns, spacing), line (spacing),
  # circle (radius) or random (width, height), starting at x, y.
  - { type: client, id: 2, count: 15, layout: grid, columns: 4, spacing: 50, x: 0, y: 0 }

test:
  steps:
    - { wait: "Received response", node: 2 }   # a corner, three hops out
