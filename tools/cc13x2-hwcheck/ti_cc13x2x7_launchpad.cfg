# openocd board file for CC13x2x7/CC26x2x7 LaunchPads (LP-CC1312R7, ...).
#
# openocd 0.12's target/ti_cc13x2.cfg expects the CC13x2's ICEPick ID,
# 0x0BB4102F.  An x7 part's ICEPick reports 0x0BB7702F, so with that file
# the setup event never fires and the CPU tap is never enabled.  This is
# board/ti_cc13x2_launchpad.cfg with the x7 ID; the chip name stays cc13x2
# so catch.tcl works for both, and the cc26xx flash driver programs all
# 704 KB of a CC1312R7.
source [find interface/xds110.cfg]
adapter speed 5500
transport select jtag

set CHIPNAME cc13x2
set JRC_TAPID 0x0BB7702F
set WORKAREASIZE 0x7000

source [find target/ti_cc26x0.cfg]
